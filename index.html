<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
        .subtitle { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        label { font-size: 0.8rem; font-weight: 600; color: #374151; display: block; margin-bottom: 0.25rem; }

        input, select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .full { grid-column: 1 / -1; }

        button {
            grid-column: 1 / -1;
            padding: 0.7rem;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
        }
        .filter-bar label { margin: 0; font-size: 0.85rem; font-weight: 600; }
        .filter-bar input[type="date"] { width: auto; }
        .filter-bar .btn {
            background: #eef2ff;
            color: #4338ca;
            border: none;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .filter-bar .btn:hover { background: #e0e7ff; }
        .filter-bar .clear {
            background: #f3f4f6;
            color: #6b7280;
            border: none;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            cursor: pointer;
        }

        h2 { font-size: 1.1rem; margin: 1.5rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; }

        .entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.95rem;
        }
        .entry .date { color: #6b7280; font-size: 0.8rem; }
        .entry .cat { background: #eef2ff; color: #4338ca; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
        .entry .amount { font-weight: 600; }
        .entry .delete { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.9rem; padding: 0 0.25rem; }
        .entry .delete:hover { color: #b91c1c; }

        .totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
        .total-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem; text-align: center; }
        .total-card .cat { font-size: 0.8rem; color: #6b7280; }
        .total-card .sum { font-size: 1.2rem; font-weight: 700; color: #111827; }

        .empty { color: #9ca3af; text-align: center; padding: 1.5rem 0; font-size: 0.9rem; }

        .grand { margin-top: 1rem; text-align: right; font-size: 1.1rem; font-weight: 700; }

        .daily-summary { margin-top: 0.5rem; }
        .day-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-card .day { font-weight: 600; color: #111827; }
        .day-card .count { color: #6b7280; font-size: 0.85rem; }
        .day-card .sum { font-weight: 700; color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💸 Expense Tracker</h1>
        <p class="subtitle">Add expenses day by day, then see totals per day, per month, and overall.</p>

        <form id="expense-form">
            <div>
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div>
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select…</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="full" id="custom-cat-wrap" style="display:none;">
                <label for="custom-cat">Custom category</label>
                <input type="text" id="custom-cat" placeholder="e.g. Medical, Gifts, Rent">
            </div>
            <div class="full">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
            </div>
            <button type="submit">Add Expense</button>
        </form>

        <div class="filter-bar">
            <label for="filter-date">View day:</label>
            <input type="date" id="filter-date">
            <button type="button" class="btn" id="today-btn">Today</button>
            <button type="button" class="clear" id="clear-filter">Show all</button>
        </div>

        <h2 id="entries-title">Entries</h2>
        <div id="entries"></div>

        <h2>Daily Summary</h2>
        <div id="daily-summary" class="daily-summary"></div>

        <h2>Monthly Summary</h2>
        <div id="monthly-summary" class="daily-summary"></div>

        <h2>Totals by Category</h2>
        <div id="totals" class="totals"></div>
        <div id="grand" class="grand"></div>
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        let filterDate = '';

        function todayString() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        document.getElementById('date').value = todayString();

        // Show the custom category box only when "Other" is picked
        const catSelect = document.getElementById('category');
        const customWrap = document.getElementById('custom-cat-wrap');
        const customInput = document.getElementById('custom-cat');

        catSelect.addEventListener('change', () => {
            customWrap.style.display = catSelect.value === 'Other' ? 'block' : 'none';
        });

        function filtered() {
            if (!filterDate) return expenses;
            return expenses.filter(e => e.date === filterDate);
        }

        function renderEntries() {
            const container = document.getElementById('entries');
            const title = document.getElementById('entries-title');
            const list = filtered();

            title.textContent = filterDate ? `Entries for ${filterDate}` : 'Entries';

            if (list.length === 0) {
                container.innerHTML = '<p class="empty">No expenses here yet.</p>';
                return;
            }

            const sorted = [...list].sort((a, b) => b.date.localeCompare(a.date));
            container.innerHTML = sorted.map(e => `
                <div class="entry">
                    <span class="date">${e.date}</span>
                    <span class="cat">${e.category}</span>
                    <span class="amount">₹${Number(e.amount).toFixed(2)}</span>
                    <button class="delete" data-id="${e.id}">✕</button>
                </div>
            `).join('');
        }

        function renderDaily() {
            const container = document.getElementById('daily-summary');
            const byDay = {};
            for (const e of expenses) {
                byDay[e.date] = byDay[e.date] || { total: 0, count: 0 };
                byDay[e.date].total += e.amount;
                byDay[e.date].count += 1;
            }

            const days = Object.keys(byDay).sort().reverse();

            if (days.length === 0) {
                container.innerHTML = '<p class="empty">No days recorded yet.</p>';
                return;
            }

            container.innerHTML = days.map(date => `
                <div class="day-card">
                    <span class="day">${date}</span>
                    <span class="count">${byDay[date].count} expense(s)</span>
                    <span class="sum">₹${byDay[date].total.toFixed(2)}</span>
                </div>
            `).join('');
        }

        function renderMonthly() {
            const container = document.getElementById('monthly-summary');
            const monthTotals = {};
            const monthCounts = {};
            for (const e of expenses) {
                const month = e.date.slice(0, 7);
                monthTotals[month] = (monthTotals[month] || 0) + e.amount;
                monthCounts[month] = (monthCounts[month] || 0) + 1;
            }

            const months = Object.keys(monthTotals).sort().reverse();

            if (months.length === 0) {
                container.innerHTML = '<p class="empty">No months recorded yet.</p>';
                return;
            }

            container.innerHTML = months.map(m => `
                <div class="day-card">
                    <span class="day">${m}</span>
                    <span class="count">${monthCounts[m]} expense(s)</span>
                    <span class="sum">₹${monthTotals[m].toFixed(2)}</span>
                </div>
            `).join('');
        }

        function renderTotals() {
            const container = document.getElementById('totals');
            const grandEl = document.getElementById('grand');
            const list = filtered();

            const totals = {};
            let grandTotal = 0;
            for (const e of list) {
                totals[e.category] = (totals[e.category] || 0) + e.amount;
                grandTotal += e.amount;
            }

            const cats = Object.keys(totals);
            if (cats.length === 0) {
                container.innerHTML = '<p class="empty">No totals yet.</p>';
                grandEl.textContent = '';
                return;
            }

            container.innerHTML = cats.map(cat => `
                <div class="total-card">
                    <div class="cat">${cat}</div>
                    <div class="sum">₹${totals[cat].toFixed(2)}</div>
                </div>
            `).join('');

            const label = filterDate ? `Total for ${filterDate}` : 'Grand Total (all days)';
            grandEl.textContent = `${label}: ₹${grandTotal.toFixed(2)}`;
        }

        function saveAndRender() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
            renderEntries();
            renderDaily();
            renderMonthly();
            renderTotals();
        }

        document.getElementById('expense-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            let category = catSelect.value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (category === 'Other') {
                category = customInput.value.trim() || 'Other';
            }

            if (!date || !category || isNaN(amount) || amount < 0) return;

            expenses.push({ id: Date.now(), date, category, amount });
            saveAndRender();

            document.getElementById('amount').value = '';
            customInput.value = '';
            customWrap.style.display = 'none';
            catSelect.value = '';
        });

        document.getElementById('entries').addEventListener('click', (e) => {
            if (e.target.classList.contains('delete')) {
                const id = Number(e.target.dataset.id);
                expenses = expenses.filter(exp => exp.id !== id);
                saveAndRender();
            }
        });

        document.getElementById('filter-date').addEventListener('change', (e) => {
            filterDate = e.target.value;
            saveAndRender();
        });
        document.getElementById('today-btn').addEventListener('click', () => {
            filterDate = todayString();
            document.getElementById('filter-date').value = filterDate;
            saveAndRender();
        });
        document.getElementById('clear-filter').addEventListener('click', () => {
            filterDate = '';
            document.getElementById('filter-date').value = '';
            saveAndRender();
        });

        renderEntries();
        renderDaily();
        renderMonthly();
        renderTotals();
    </script>
</body>
</html>
